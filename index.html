<div class="top"><div class="brand">DON'T FIGHT YET · MVP TEST CANDIDATE 2</div><div class="lang"><button id="en" onclick="setLang('en')">EN</button><button id="es" onclick="setLang('es')">ES</button></div></div>


<section id="intro" class="screen active">
<style>
.dfy-stage{min-height:68vh;display:flex;flex-direction:column;justify-content:center;text-align:center}
.dfy-anim{position:relative;min-height:210px;display:flex;align-items:center;justify-content:center}
.dfy-line{position:absolute;width:100%;opacity:0;transform:translateY(8px);animation:dfyFade 8.2s ease-in-out forwards}
.dfy-line.brand{font-size:clamp(3rem,12vw,5.2rem);font-weight:800;line-height:.94;letter-spacing:-.055em;animation-delay:.15s}

 .dfy-line{animation:none;display:none}.dfy-line.brand{display:block;opacity:1;position:relative;transform:none}
 .dfy-start{animation:none;opacity:1;pointer-events:auto}

<div class="dfy-anim">

<div class="dfy-line one" data-en="You don't have to solve it right now." data-es="No tienes que resolverlo ahora."></div>
<div class="dfy-line two" data-en="Just avoid making it worse." data-es="Solo evita empeorarlo."></div>
</div>
<button class="primary dfy-start" onclick="go('introPurpose')" data-en="Let's begin" data-es="Empecemos"></button>
</div>
</section>
<section id="introPurpose" class="screen">
<button class="back" onclick="goBack()" data-en="← Back" data-es="← Atrás"></button>
<div class="pill" data-en="DON'T FIGHT YET" data-es="DON'T FIGHT YET"></div>
<p style="font-size:1.18rem;line-height:1.55;margin-top:24px" data-en="Don't Fight Yet doesn't try to replace a professional couples therapy session. Its purpose is to help you avoid escalating the argument further." data-es="Don't Fight Yet no intenta reemplazar una sesión profesional de terapia de pareja. Su propósito es ayudarte a evitar que la discusión escale aún más."></p>
<div class="why" style="margin-top:26px" data-en="<b>If a discussion with your partner has left you affected and you can't stop thinking about it, start now.</b><br><br>Here you'll find a guide designed to help you avoid making the situation worse." data-es="<b>Si te sientes afectado/a por una discusión con tu pareja en la que no dejas de pensar, empieza ahora.</b><br><br>Aquí encontrarás una guía que intentará ayudarte a no empeorar la situación."></div>
<button class="primary" onclick="enterApp()" data-en="Continue" data-es="Continuar"></button>
<button onclick="go('danger')" data-en="I'm in a safety situation" data-es="Estoy en una situación de peligro"></button>
<label style="display:flex;gap:9px;align-items:flex-start;margin-top:14px;font-size:.88rem;opacity:.8">
<input id="skipIntro" type="checkbox" style="width:auto;margin-top:3px">
<span data-en="Don't show this introduction next time" data-es="No volver a mostrar esta introducción"></span>
</label>
</section>


<section id="askOrMentalLoad" class="screen">
<button class="back" onclick="goBack()" data-en="← Back" data-es="← Atrás"></button><div class="pill" data-en="EVERYDAY TRIGGER" data-es="DETONANTE COTIDIANO"></div>
<h1 data-en="It bothers me that I have to ask." data-es="Me molesta tener que pedírselo."></h1><p data-en="What is actually bothering you?" data-es="¿Qué es lo que realmente te molesta?"></p>
<button onclick="go('mentalLoad')" data-en="I feel like I have to notice, remember and manage everything" data-es="Siento que tengo que detectar, recordar y gestionar todo"></button>
<button onclick="go('justAsk')" data-en="My partner should notice without me having to say it" data-es="Mi pareja debería darse cuenta sin que yo tenga que decirlo"></button></section>

<section id="justAsk" class="screen">
<button class="back" onclick="goBack()" data-en="← Back" data-es="← Atrás"></button><div class="pill" data-en="JUST ASK" data-es="SIMPLEMENTE PÍDELO"></div>
<h1 data-en="Don't turn a need into a silent test." data-es="No conviertas una necesidad en una prueba silenciosa."></h1>
<p data-en="Something can feel obvious to you and still not be on your partner's radar with the same priority." data-es="Algo puede parecerte obvio y, aun así, no estar en el radar de tu pareja con la misma prioridad."></p>
<div class="why" data-en="<b>Your partner can't read your mind.</b><br>Make the need explicit before frustration turns the request into a complaint." data-es="<b>Tu pareja no puede leerte la mente.</b><br>Haz explícita la necesidad antes de que la frustración convierta el pedido en reclamo."></div>
<button onclick="go('askBetter')" data-en="Help me ask for it better" data-es="Ayúdame a pedirlo mejor"></button><button onclick="go('mentalLoad')" data-en="But I'm tired of asking for everything" data-es="Pero estoy cansado/a de tener que pedirlo todo"></button></section>

<section id="askBetter" class="screen">
<button class="back" onclick="goBack()" data-en="← Back" data-es="← Atrás"></button><div class="pill" data-en="SAY IT BETTER" data-es="DILO MEJOR"></div>
<h1 data-en="Make the request easy to understand." data-es="Haz que tu pedido sea fácil de entender."></h1>
<div class="why" data-en="<b>Try:</b> situation + specific request + when.<br><br>“Could you take care of ___ before ___? It's important to me.”" data-es="<b>Prueba:</b> situación + pedido concreto + cuándo.<br><br>“¿Puedes encargarte de ___ antes de ___? Para mí es importante.”"></div>
<button onclick="go('feedback')" data-en="I can try that" data-es="Puedo intentar eso"></button></section>

<section id="mentalLoad" class="screen">
<button class="back" onclick="goBack()" data-en="← Back" data-es="← Atrás"></button><div class="pill" data-en="MENTAL LOAD" data-es="CARGA MENTAL"></div>
<h1 data-en="Maybe the problem isn't this one task." data-es="Quizás el problema no sea esta tarea."></h1>
<p data-en="You may be tired of having to notice what needs doing, remember it and assign it every time." data-es="Tal vez estás cansado/a de tener que detectar lo que falta, recordarlo y asignarlo cada vez."></p>
<button onclick="go('askBetter')" data-en="I need this one concrete thing done" data-es="Necesito que haga esta cosa concreta"></button>
<button onclick="go('sharedResponsibility')" data-en="I need recurring responsibilities without reminders" data-es="Necesito responsabilidades recurrentes sin recordatorios"></button></section>

<section id="sharedResponsibility" class="screen">
<button class="back" onclick="goBack()" data-en="← Back" data-es="← Atrás"></button><div class="pill" data-en="SHARED RESPONSIBILITY" data-es="RESPONSABILIDAD COMPARTIDA"></div>
<h1 data-en="Agree on ownership, not endless reminders." data-es="Acuerden responsabilidad, no recordatorios interminables."></h1>
<div class="why" data-en="Try: “I don't want to keep reminding you about this. Can we agree that you fully own ___ and I own ___?”" data-es="Prueba: “No quiero estar recordándote esto cada semana. ¿Podemos acordar que tú te encargues completamente de ___ y yo de ___?”"></div>
<button onclick="go('partnerSaysAskEverything')" data-en="My partner says they have to ask me for everything" data-es="Mi pareja dice que tiene que pedírmelo todo"></button><button onclick="go('feedback')" data-en="That helps me frame it" data-es="Esto me ayuda a plantearlo"></button></section>

<section id="partnerSaysAskEverything" class="screen">
<button class="back" onclick="goBack()" data-en="← Back" data-es="← Atrás"></button><div class="pill" data-en="LISTEN FOR THE REAL REQUEST" data-es="ESCUCHA EL PEDIDO REAL"></div>
<h1 data-en="Don't answer “then just ask me” yet." data-es="No respondas “entonces solo pídemelo” todavía."></h1>
<p data-en="They may be tired of having to notice, remember and assign it every time." data-es="Puede estar cansado/a de tener que detectarlo, recordarlo y asignarlo cada vez."></p>
<div class="why" data-en="Try: “Is what bothers you having to ask me, or feeling like you have to stay on top of this all the time?”" data-es="Prueba: “¿Lo que te molesta es tener que pedírmelo o sentir que tienes que estar pendiente de esto todo el tiempo?”"></div>
<button onclick="go('feedback')" data-en="I can ask that" data-es="Puedo preguntar eso"></button></section>

<section id="drivingConflict" class="screen">
<button class="back" onclick="goBack()" data-en="← Back" data-es="← Atrás"></button><div class="pill" data-en="IN THE CAR" data-es="EN EL AUTO"></div>
<h1 data-en="Does your partner criticize how you drive?" data-es="¿Tu pareja critica cómo conduces?"></h1><p data-en="Are you driving right now?" data-es="¿Estás conduciendo ahora?"></p>
<button onclick="go('drivingNow')" data-en="Yes" data-es="Sí"></button><button onclick="go('drivingAfter')" data-en="No" data-es="No"></button></section>

<section id="drivingNow" class="screen">
<div class="pill" data-en="SAFETY FIRST" data-es="SEGURIDAD PRIMERO"></div><h1 data-en="Stop reading. Focus on driving." data-es="Deja de leer. Concéntrate en conducir."></h1>
<p data-en="Don't try to solve the argument behind the wheel." data-es="No intentes resolver la discusión mientras estás al volante."></p>
<div class="why" data-en="“I want to talk about this, but not while I'm driving. We'll talk when we arrive.”" data-es="“Quiero hablar de esto, pero no mientras conduzco. Cuando lleguemos lo hablamos.”"></div>
<button onclick="go('home')" data-en="I'll put the phone down" data-es="Voy a dejar el teléfono"></button></section>

<section id="drivingAfter" class="screen">
<button class="back" onclick="goBack()" data-en="← Back" data-es="← Atrás"></button><div class="pill" data-en="IN THE CAR" data-es="EN EL AUTO"></div>
<h1 data-en="Separate safety from criticism." data-es="Separa seguridad de crítica."></h1>
<button onclick="go('drivingCriticism')" data-en="They constantly correct how I drive" data-es="Me corrige constantemente cómo conduzco"></button>
<button onclick="go('drivingCriticism')" data-en="They shouted about how I was driving" data-es="Me gritó por cómo estaba conduciendo"></button>
<button onclick="go('drivingSafety')" data-en="They warned me about an immediate danger" data-es="Me advirtió de un peligro inmediato"></button></section>

<section id="drivingSafety" class="screen">
<button class="back" onclick="goBack()" data-en="← Back" data-es="← Atrás"></button><div class="pill" data-en="SAFETY" data-es="SEGURIDAD"></div>
<h1 data-en="An immediate warning is different from criticism." data-es="Una advertencia inmediata es diferente de una crítica."></h1>
<p data-en="Deal with a real hazard first. You can discuss tone afterward." data-es="Atiende primero un peligro real. Después pueden hablar del tono."></p>
<button onclick="go('deliveryMatters')" data-en="I also need to talk about how it was said" data-es="También necesito hablar de cómo me lo dijo"></button><button onclick="go('feedback')" data-en="That distinction helps" data-es="Esa distinción me ayuda"></button></section>

<section id="drivingCriticism" class="screen">
<button class="back" onclick="goBack()" data-en="← Back" data-es="← Atrás"></button><div class="pill" data-en="DRIVE FIRST. DISCUSS LATER." data-es="PRIMERO CONDUCE. DESPUÉS HABLEN."></div>
<div class="why" data-en="Try: “If you see something dangerous, tell me immediately. If it's about how you prefer me to drive, let's talk when we arrive.”" data-es="Prueba: “Si ves algo peligroso, dímelo inmediatamente. Si es sobre cómo prefieres que conduzca, hablemos cuando lleguemos.”"></div>
<button onclick="go('deliveryMatters')" data-en="The way they say it is also part of the problem" data-es="La forma en que me lo dice también es parte del problema"></button><button onclick="go('feedback')" data-en="I know what to say" data-es="Ya sé qué decir"></button></section>

<section id="deliveryMatters" class="screen">
<button class="back" onclick="goBack()" data-en="← Back" data-es="← Atrás"></button><div class="pill" data-en="THE WAY YOU SAY IT MATTERS" data-es="LAS FORMAS TAMBIÉN COMUNICAN"></div>
<h1 data-en="The message may be valid. The delivery can still push you away." data-es="El mensaje puede ser válido. La forma aun así puede distanciarte."></h1>
<p data-en="What makes it harder to listen?" data-es="¿Qué hace más difícil escucharlo?"></p>
<button onclick="go('deliveryResponse')" data-en="The tone" data-es="El tono"></button><button onclick="go('deliveryResponse')" data-en="Sarcasm or mockery" data-es="El sarcasmo o la burla"></button>
<button onclick="go('deliveryResponse')" data-en="Gestures or facial expressions" data-es="Los gestos o expresiones"></button><button onclick="go('deliveryResponse')" data-en="Always / never and generalizations" data-es="“Siempre / nunca” y generalizaciones"></button></section>

<section id="deliveryResponse" class="screen">
<button class="back" onclick="goBack()" data-en="← Back" data-es="← Atrás"></button><div class="pill" data-en="SEPARATE CONTENT FROM DELIVERY" data-es="SEPARA CONTENIDO Y FORMA"></div>
<div class="why" data-en="Try: “I want to understand what you're telling me. I'm finding it hard to listen because of how we're talking. Can we lower the intensity and continue?”" data-es="Prueba: “Quiero entender lo que me estás diciendo. Me está costando escucharlo por cómo estamos hablando. ¿Podemos bajar la intensidad y continuar?”"></div>
<button onclick="go('deliveryMirror')" data-en="My partner says my way of speaking pushes them away" data-es="Mi pareja dice que mi forma de hablar la distancia"></button><button onclick="go('feedback')" data-en="I can try this" data-es="Puedo intentar esto"></button></section>

<section id="deliveryMirror" class="screen">
<button class="back" onclick="goBack()" data-en="← Back" data-es="← Atrás"></button><div class="pill" data-en="CHECK YOUR SIDE" data-es="REVISA TU PARTE"></div>
<h1 data-en="You can be right about the issue and wrong about the delivery." data-es="Puedes tener razón sobre el tema y equivocarte en la forma."></h1>
<p data-en="Is there something valid in what your partner points out about your tone, sarcasm, gestures or generalizations?" data-es="¿Hay algo válido en lo que tu pareja señala sobre tu tono, sarcasmo, gestos o generalizaciones?"></p>
<button onclick="go('feedback')" data-en="Yes, I can own part of that" data-es="Sí, puedo reconocer una parte"></button></section>

<section id="notMySituation" class="screen">
<button class="back" onclick="goBack()" data-en="← Back" data-es="← Atrás"></button><div class="pill" data-en="HELP US BUILD IT" data-es="AYÚDANOS A CONSTRUIRLO"></div>
<h1 data-en="Don't see your situation?" data-es="¿No encuentras tu situación?"></h1>
<p data-en="Tell us briefly. Don't include names, phone numbers, addresses or identifying details." data-es="Cuéntanos brevemente. No incluyas nombres, teléfonos, direcciones ni datos que permitan identificar a otra persona."></p>
<textarea id="missingSituation" maxlength="700" data-placeholder-en="Briefly describe what happened..." data-placeholder-es="Describe brevemente qué pasó..." placeholder="Describe brevemente qué pasó..." style="width:100%;min-height:140px;border-radius:16px;padding:14px;font:inherit;box-sizing:border-box"></textarea>
<p class="muted" data-en="For this Test Candidate, this text stays on your device unless you copy and share it with the test team." data-es="En este Test Candidate, este texto permanece en tu dispositivo salvo que lo copies y lo compartas con el equipo de prueba."></p>
<button onclick="copyMissingSituation()" data-en="Copy my feedback" data-es="Copiar mi comentario"></button><button onclick="go('home')" data-en="Back to start" data-es="Volver al inicio"></button></section>
<section id="home" class="screen">
<div class="pill" data-en="DON'T FIGHT YET" data-es="DON'T FIGHT YET"></div>
<h1 style="margin-top:22px" data-en="What is<br>Don't Fight Yet?" data-es="¿Qué es<br>Don't Fight Yet?"></h1>
<p data-en="A guide for those moments when an argument with your partner is still running through your mind, has just happened, or you need to prepare for a difficult conversation." data-es="Una guía para esos momentos en los que una discusión con tu pareja todavía está dando vueltas en tu cabeza, acaba de ocurrir o necesitas prepararte para una conversación difícil."></p>
<h2 style="margin-top:26px" data-en="Where are you right now?" data-es="¿En qué momento estás?"></h2>
<button onclick="restartAt('right')" data-en="🔥 I'M STILL ACTIVATED<br><span class='muted'>It's happening or it just happened. Help me not make it worse.</span>" data-es="🔥 SIGO ALTERADO/A<br><span class='muted'>Está pasando o acaba de pasar. Ayúdame a no empeorarlo.</span>"></button>
<button onclick="restartAt('after')" data-en="💔 THE FIGHT IS OVER<br><span class='muted'>I need help with what was left after it.</span>" data-es="💔 LA PELEA YA TERMINÓ<br><span class='muted'>Necesito ayuda con lo que quedó después.</span>"></button>
<button onclick="restartAt('before')" data-en="💬 I NEED TO TALK ABOUT SOMETHING<br><span class='muted'>Help me prepare before I say it.</span>" data-es="💬 NECESITO HABLAR DE ALGO<br><span class='muted'>Ayúdame a prepararme antes de decirlo.</span>"></button>
<button class="back" onclick="go('introPurpose')" data-en="About Don't Fight Yet" data-es="Acerca de Don't Fight Yet"></button>
<div style="margin-top:28px"></div><div class="pill" data-en="COMMON EVERYDAY TRIGGERS" data-es="DETONANTES COTIDIANOS"></div>
<button onclick="go('askOrMentalLoad')" data-en="It bothers me that I have to ask" data-es="Me molesta tener que pedirlo"></button>
<button onclick="go('drivingConflict')" data-en="We fight about how I drive" data-es="Discutimos por cómo conduzco"></button>
<button onclick="go('deliveryMatters')" data-en="The way my partner says things pushes me away" data-es="La forma en que mi pareja dice las cosas me distancia"></button>
<button onclick="go('notMySituation')" data-en="I don't see my situation" data-es="No encuentro mi situación"></button></section>

<section id="right" class="screen">
<button class="back" onclick="go('home')" data-en="← Home" data-es="← Inicio"></button>
<div class="kicker" data-en="RIGHT NOW" data-es="AHORA MISMO"></div><h2 data-en="What are you dealing with?" data-es="¿Qué está pasando?"></h2>
<button onclick="go('yell')" data-en="I'm about to yell →" data-es="Estoy a punto de gritar →"></button>
<button onclick="go('defensive')" data-en="I'm getting defensive →" data-es="Me estoy poniendo a la defensiva →"></button>
<button onclick="go('criticism')" data-en="My partner is criticizing me →" data-es="Mi pareja me está criticando →"></button>
<button onclick="go('chase')" data-en="My partner is walking away and I want to follow them →" data-es="Mi pareja se está alejando y quiero ir detrás →"></button>
</section>

<section id="yell" class="screen">
<button class="back" onclick="goBack()" data-en="← Back" data-es="← Atrás"></button><div class="kicker" data-en="STOP" data-es="ALTO"></div>
<h2 data-en="Don't say the next thing yet." data-es="No digas nada aún."></h2>
<p data-en="If you're about to yell, solving the problem is no longer the priority." data-es="Si estás a punto de gritar, resolver el problema ya no es la prioridad."></p>
<div class="why" data-en="<b>Because</b> when you're this activated, listening and choosing your words gets harder." data-es="<b>Porque</b> cuando estás así de alterado, escuchar y elegir bien tus palabras se vuelve más difícil."></div>
<button class="primary" onclick="go('yellAfter60')" data-en="Give me 60 seconds" data-es="Dame 60 segundos"></button>
</section>

<section id="defensive" class="screen">
<button class="back" onclick="goBack()" data-en="← Home" data-es="← Inicio"></button>
<div class="kicker" data-en="60-SECOND RESET" data-es="RESET DE 60 SEGUNDOS"></div>
<h2 data-en="You don't have to win this moment." data-es="No tienes que ganar este momento."></h2>
<p data-en="Is there at least 5% of what they're saying that you can honestly recognize as yours?" data-es="¿Hay al menos un 5% de lo que dice que puedes reconocer honestamente como tuyo?"></p>
<div class="why" data-en="<b>Because</b> owning your part can interrupt the defend–attack cycle without forcing you to agree with everything." data-es="<b>Porque</b> reconocer tu parte puede cortar el ciclo defensa–ataque sin obligarte a estar de acuerdo con todo."></div>
<button class="primary" onclick="go('defensiveYes')" data-en="Yes — there is something I can own" data-es="Sí — hay algo que puedo reconocer"></button>
<button onclick="go('defensiveNo')" data-en="No — honestly, I don't see anything I agree with" data-es="No — sinceramente, no veo nada que pueda reconocer"></button>
</section>

<section id="criticism" class="screen">
<button class="back" onclick="goBack()" data-en="← Back" data-es="← Atrás"></button><div class="kicker" data-en="SEPARATE TWO THINGS" data-es="SEPARA DOS COSAS"></div>
<h2 data-en="Separate WHAT they're asking from HOW they're saying it." data-es="Separa LO que te está pidiendo de CÓMO te lo está diciendo."></h2>
<div class="why" data-en="<b>Because</b> separating the request from the delivery can keep one painful moment from becoming two arguments at once." data-es="<b>Porque</b> separar la petición de la forma puede evitar que un momento difícil se convierta en dos discusiones al mismo tiempo."></div>
<button class="primary" onclick="go('criticismSeparate')" data-en="Help me separate the request from the delivery" data-es="Ayúdame a separar lo que pide de cómo lo dice"></button>

<section id="beforeWordsHurt" class="screen">

<section id="beforeWordsNeed" class="screen">

<section id="understandAfterExtra" class="screen">
<button class="back" onclick="goBack()" data-en="← Back" data-es="← Atrás"></button>
<h2 data-en="You asked once more and now understand enough to decide what comes next." data-es="Preguntaste una vez más y ahora entiendes lo suficiente para decidir qué sigue."></h2>
<button onclick="go('agreement')" data-en="We found something concrete we can agree to do differently" data-es="Encontramos algo concreto que podemos acordar hacer diferente"></button>
<button onclick="go('noAgreement')" data-en="I understand better, but we still disagree" data-es="Entiendo mejor, pero seguimos sin estar de acuerdo"></button>
<button onclick="go('feedback')" data-en="That's enough for now" data-es="Por ahora es suficiente"></button>
</section>

<section id="chaseUrgePersistent" class="screen">
<button class="back" onclick="goBack()" data-en="← Back" data-es="← Atrás"></button>
<h2 data-en="The urge is still there even after you gave space." data-es="La urgencia sigue ahí incluso después de haberle dado espacio."></h2>
<p data-en="Don't turn the same urge into another round of following. For now, keep the physical distance and regulate yourself instead of reopening the conversation." data-es="No conviertas la misma urgencia en otra ronda de persecución. Por ahora, mantén la distancia física y regúlate en lugar de reabrir la conversación."></p>
<button class="primary" onclick="go('feedback')" data-en="I won't follow them — close this intervention" data-es="No iré detrás — cerrar esta intervención"></button>
<button onclick="go('danger')" data-en="I'm afraid something unsafe is happening" data-es="Temo que esté ocurriendo algo inseguro"></button>
</section>

<section id="escalationClosure" class="screen">
<button class="back" onclick="goBack()" data-en="← Back" data-es="← Atrás"></button>
<div class="kicker" data-en="STOP THE LOOP" data-es="DETÉN EL CICLO"></div>
<h2 data-en="This intervention has reached its limit for this moment." data-es="Esta intervención llegó a su límite para este momento."></h2>
<p data-en="The conflict escalated again after an attempt to de-escalate. Don't restart another communication route immediately. Create distance from the argument and return only when the intensity has genuinely dropped." data-es="El conflicto volvió a escalar después de intentar desescalarlo. No reinicies inmediatamente otra ruta de comunicación. Toma distancia de la discusión y retómala solo cuando la intensidad haya bajado de verdad."></p>
<button class="primary" onclick="go('home')" data-en="Finish for now" data-es="Terminar por ahora"></button>
<button onclick="go('professionalHelpInfo')" data-en="This pattern keeps repeating" data-es="Este patrón se repite constantemente"></button>
<button onclick="go('danger')" data-en="There is fear, threats, aggression, or danger" data-es="Hay miedo, amenazas, agresión o peligro"></button>
</section>

<section id="preConversationRegulate" class="screen">
<button class="back" onclick="goBack()" data-en="← Back" data-es="← Atrás"></button>
<h2 data-en="Then don't start the conversation yet." data-es="Entonces todavía no inicies la conversación."></h2>
<p data-en="If you aren't ready to hear an answer you may dislike, preparation has done its job: it showed you that this isn't the moment to begin." data-es="Si todavía no estás listo/a para escuchar una respuesta que quizá no te guste, la preparación ya cumplió una función: mostrarte que este no es el momento de empezar."></p>
<button class="primary" onclick="go('home')" data-en="Pause and return later" data-es="Pausar y volver más tarde"></button>
</section>

<section id="resumeLaterPrep" class="screen">
<button class="back" onclick="goBack()" data-en="← Back" data-es="← Atrás"></button>
<div class="kicker" data-en="FOR LATER" data-es="PARA MÁS TARDE"></div>
<h2 data-en="Keep the next conversation small." data-es="Mantén pequeña la próxima conversación."></h2>
<p data-en="Choose one issue, one concrete request, and one moment when both of you are calmer. You don't need to reopen everything now." data-es="Elige un solo tema, una petición concreta y un momento en que ambos estén más tranquilos. No necesitas reabrir todo ahora."></p>
<div class="script" data-en="“When we're both calmer, I'd like to come back to one part of what happened. I don't want to restart the fight; I want us to understand that part better.”" data-es="“Cuando estemos más tranquilos, me gustaría retomar una parte de lo que pasó. No quiero reiniciar la pelea; quiero que entendamos mejor esa parte.”"></div>
<button class="primary" onclick="go('home')" data-en="Save this for later and finish" data-es="Guardar esto para después y terminar"></button>
</section>
</main>
<script>
function enterApp(){
  try{
    const cb=document.getElementById('skipIntro');
    if(cb && cb.checked) localStorage.setItem('dfySkipIntro','1');
  }catch(e){}
  go('home');
}
function applyIntroPreference(){
  try{
    if(localStorage.getItem('dfySkipIntro')==='1'){
      document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
      const h=document.getElementById('home'); if(h) h.classList.add('active');
    }
  }catch(e){}
}

let navHistory = [];
function goBack(){
  const prev=navHistory.pop() || 'home';
  window.__goingBack=true; go(prev); window.__goingBack=false;
}

let lang='es';
function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(el=>{el.innerHTML=el.dataset[lang]});document.querySelectorAll('[data-placeholder-en]').forEach(el=>{el.placeholder=(lang==='en'?el.dataset.placeholderEn:el.dataset.placeholderEs)});document.getElementById('en').classList.toggle('on',lang==='en');document.getElementById('es').classList.toggle('on',lang==='es');}
function setLang(x){lang=x;render();try{localStorage.setItem('dfyLang',x)}catch(e){}}
function go(id){
  const cur=document.querySelector('.screen.active');
  if(cur && !window.__goingBack && cur.id!==id) navHistory.push(cur.id);
document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));const el=document.getElementById(id);if(!el){alert('Route error: '+id);return}el.classList.add('active');scrollTo(0,0)}
try{lang=localStorage.getItem('dfyLang')||'es'}catch(e){} render();

document.addEventListener('DOMContentLoaded', applyIntroPreference);
function recordFeedbackTC(v){try{let a=JSON.parse(localStorage.getItem("dfy_tc_feedback")||"[]");a.push({value:v,at:new Date().toISOString()});localStorage.setItem("dfy_tc_feedback",JSON.stringify(a));}catch(e){}go("feedbackThanksTC");}
function copyMissingSituation(){const e=document.getElementById("missingSituation");const t=e?e.value.trim():"";if(!t)return;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).finally(()=>go("feedbackThanksTC"));}else{try{e.select();document.execCommand("copy");}catch(x){}go("feedbackThanksTC");}}function restartAt(id){historyStack=[];show(id);window.scrollTo(0,0);}
</script></body></html>
